<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <title>Unlabelled categorical triangle and coherence square</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1 10 5 2 9" fill="none" stroke="#234e70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <!-- Double shaft and one open head, following Semantic Factorization and Descent. -->
    <g id="two-cell" fill="none" stroke="#234e70" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-24 -3.5 H18.1 M-24 3.5 H18.1 M13 -8 Q17 -3.5 24 0 Q17 3.5 13 8"/>
    </g>
  </defs>
  <g fill="none" stroke="#234e70" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M200 210 H398"/>
    <path d="M195 222 292 355"/>
    <path d="M405 222 308 355"/>
    <path d="M200 430 H398"/>
    <path d="M190 441 V539"/>
    <path d="M410 441 V539"/>
    <path d="M200 550 H398"/>
  </g>
  <g class="two-cells">
    <use href="#two-cell" transform="translate(300 282) rotate(-35)"/>
    <use href="#two-cell" transform="translate(300 490) rotate(-45)"/>
  </g>
  <g fill="#faf6e9" stroke="#234e70" stroke-width="2.4">
    <circle cx="190" cy="210" r="5.5"/><circle cx="410" cy="210" r="5.5"/><circle cx="300" cy="367" r="5.5"/>
    <circle cx="190" cy="430" r="5.5"/><circle cx="410" cy="430" r="5.5"/>
    <circle cx="190" cy="550" r="5.5"/><circle cx="410" cy="550" r="5.5"/>
  </g>
</svg>

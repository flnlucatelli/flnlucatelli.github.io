  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 4 1 7" fill="none" stroke="#193c65" stroke-width="1.3" stroke-linejoin="round"/></marker>
  </defs>
  <g fill="#193c65" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <g font-size="42" font-style="italic">
